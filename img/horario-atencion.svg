<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14181d"/>
      <stop offset="50%" stop-color="#1f242d"/>
      <stop offset="100%" stop-color="#0b0d10"/>
    </linearGradient>
    <linearGradient id="neonYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE033"/>
      <stop offset="100%" stop-color="#FF9900"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <!-- Tarjeta base oscura elegante -->
  <rect x="15" y="15" width="570" height="420" rx="28" fill="url(#bgGrad)" stroke="#343a40" stroke-width="2"/>
  
  <!-- Efecto luz superior decorativo -->
  <circle cx="300" cy="30" r="140" fill="#FFB800" opacity="0.15"/>

  <!-- Taller / Elevador con Silueta de Auto Deportivo en Servicio -->
  <g transform="translate(100, 35)">
    <!-- Columnas del elevador hidráulico -->
    <rect x="40" y="30" width="16" height="150" rx="4" fill="#3a414b" stroke="#495057" stroke-width="2"/>
    <rect x="344" y="30" width="16" height="150" rx="4" fill="#3a414b" stroke="#495057" stroke-width="2"/>
    <rect x="25" y="170" width="46" height="12" rx="3" fill="#212529"/>
    <rect x="329" y="170" width="46" height="12" rx="3" fill="#212529"/>
    <!-- Brazos elevadores -->
    <rect x="52" y="115" width="296" height="8" rx="3" fill="#ffc107"/>
    <!-- Silueta del Deportivo Moderno -->
    <path d="M 75,115 C 85,95 115,85 155,80 L 210,65 C 240,65 295,74 315,90 L 335,115 Z" fill="#2c333e" stroke="#6c757d" stroke-width="2"/>
    <!-- Ventanas -->
    <path d="M 160,82 L 208,70 C 235,70 270,78 285,86 L 275,88 L 165,88 Z" fill="#61dafb" opacity="0.6"/>
    <!-- Faros encendidos -->
    <polygon points="75,108 55,105 50,118 78,114" fill="#FFE033"/>
    <!-- Ruedas y rines dorados -->
    <circle cx="120" cy="115" r="24" fill="#111" stroke="#ffc107" stroke-width="4"/>
    <circle cx="120" cy="115" r="10" fill="#495057"/>
    <circle cx="280" cy="115" r="24" fill="#111" stroke="#ffc107" stroke-width="4"/>
    <circle cx="280" cy="115" r="10" fill="#495057"/>
  </g>

  <!-- Panel de Horarios de Atención Moderno -->
  <rect x="45" y="240" width="510" height="175" rx="18" fill="url(#glassGrad)" stroke="rgba(255,193,7,0.3)" stroke-width="1.5"/>
  
  <!-- Título con icono de reloj -->
  <g transform="translate(65, 258)">
    <!-- Reloj -->
    <circle cx="20" cy="20" r="16" fill="none" stroke="url(#neonYellow)" stroke-width="3"/>
    <polyline points="20,10 20,20 27,24" stroke="url(#neonYellow)" stroke-width="3" stroke-linecap="round"/>
    <text x="46" y="27" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">
      HORARIO DE ATENCIÓN
    </text>
    <rect x="350" y="8" width="100" height="24" rx="12" fill="#28a745" opacity="0.9"/>
    <text x="400" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      ● ABIERTO HOY
    </text>
  </g>

  <!-- Línea divisoria suave -->
  <line x1="65" y1="305" x2="535" y2="305" stroke="#343a40" stroke-width="1.5"/>

  <!-- Detalle Lun a Vie -->
  <g transform="translate(65, 320)">
    <rect x="0" y="0" width="225" height="52" rx="10" fill="#191d24" stroke="#2b303a"/>
    <text x="14" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffc107">LUNES A VIERNES</text>
    <text x="14" y="42" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">08:00 AM - 06:00 PM</text>
  </g>

  <!-- Detalle Sábados -->
  <g transform="translate(310, 320)">
    <rect x="0" y="0" width="225" height="52" rx="10" fill="#191d24" stroke="#2b303a"/>
    <text x="14" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffc107">SÁBADOS</text>
    <text x="14" y="42" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">08:00 AM - 01:00 PM</text>
  </g>

  <!-- Ubicación y Domingo -->
  <text x="300" y="398" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#adb5bd" text-anchor="middle">
    📍 Sede Matriz: Quito, Ecuador | Domingos y Feriados: Cerrado
  </text>
</svg>
