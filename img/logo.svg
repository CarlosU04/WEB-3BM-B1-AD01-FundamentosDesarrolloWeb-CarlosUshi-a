<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE033"/>
      <stop offset="100%" stop-color="#FF9900"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24292e"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <!-- Escudo / Emblema fondo -->
  <polygon points="60,10 105,25 95,85 60,110 25,85 15,25" fill="url(#shieldGrad)" stroke="url(#yellowGrad)" stroke-width="3.5" stroke-linejoin="round"/>
  
  <!-- Llave inglesa estilizada cruzada -->
  <path d="M42,32 L53,43 L48,48 L37,37 C34,39 30,38 28,36 C25,33 26,29 29,26 C32,23 36,24 39,27 C41,29 42,33 42,32 Z" fill="#FFE033" />
  <rect x="47" y="44" width="28" height="7" rx="3.5" transform="rotate(45 47 44)" fill="#FF9900" />
  
  <!-- Pistón / Engranaje estilizado -->
  <circle cx="60" cy="62" r="21" fill="none" stroke="url(#yellowGrad)" stroke-width="3.5" stroke-dasharray="7,3.5"/>
  <circle cx="60" cy="62" r="9" fill="#FFB800"/>

  <!-- Rayo de evolución / dinamismo -->
  <polygon points="62,40 50,62 61,62 55,84 75,58 64,58" fill="#FFFFFF" opacity="0.9"/>

  <!-- Texto Principal: AUTOFIX -->
  <text x="125" y="72" font-family="'Segoe UI', -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" letter-spacing="1.5">
    AUTO<tspan fill="url(#yellowGrad)">FIX</tspan>
  </text>

  <!-- Placa / Insignia EVOL -->
  <rect x="330" y="38" width="130" height="36" rx="6" fill="url(#yellowGrad)"/>
  <text x="395" y="64" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-weight="900" font-size="22" fill="#121518" letter-spacing="3" text-anchor="middle">
    EVOL
  </text>

  <!-- Subtítulo / Slogan -->
  <text x="128" y="98" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#adb5bd" letter-spacing="3">
    CENTRO AUTOMOTRIZ DE ALTA GAMA
  </text>
</svg>
